<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080b11">
<title>3대 퀀트 자동매매 통합 관제 허브 | Total Wealth</title>
<style>
  body { background:#080b11; color:#cbd5e1; margin:0; }
  #hub-status { position:fixed; right:10px; bottom:8px; font:11px/1.4 -apple-system,"Segoe UI","Noto Sans KR",sans-serif; color:#8492a6;
                background:rgba(16,21,34,.9); border:1px solid #202b3f; border-radius:8px; padding:4px 10px; z-index:99; }
  #hub-status.err { color:#ef4444; }
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center;color:#8492a6;font-family:sans-serif">데이터 불러오는 중…</p></div>
<div id="hub-status">로딩 중</div>
<script>
  // 데이터(hub_fragment.html)는 Pages 빌드를 거치지 않는 'data' 브랜치에서 60초마다 직접 불러옵니다.
  const RAW = "https://raw.githubusercontent.com/jungkbugk/TotalWealth/data/hub_fragment.html";
  let activeTab = "tab-all";
  function switchTab(tabId) {
    activeTab = tabId;
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('active'); });
    if (window.event && window.event.target) window.event.target.classList.add('active');
    var pane = document.getElementById(tabId); if (pane) pane.classList.add('active');
  }
  function restoreTab() {
    if (activeTab === "tab-all") return;
    var idx = ["tab-all", "tab-kr", "tab-us", "tab-coin"].indexOf(activeTab);
    document.querySelectorAll('.tab-btn').forEach(function (b, i) { b.classList.toggle('active', i === idx); });
    document.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.toggle('active', p.id === activeTab); });
  }
  async function load() {
    var st = document.getElementById("hub-status");
    try {
      var r = await fetch(RAW + "?t=" + Math.floor(Date.now() / 20000), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      document.getElementById("app").innerHTML = await r.text();
      restoreTab();
      st.className = ""; st.textContent = "자동 갱신 60초 · " + new Date().toLocaleTimeString("ko-KR");
    } catch (e) {
      st.className = "err"; st.textContent = "갱신 실패(" + e.message + ") · 재시도 중";
    }
  }
  load(); setInterval(load, 60000);
</script>
</body>
</html>
